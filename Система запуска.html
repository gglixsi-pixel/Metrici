<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Система запуска продукта — Александра Дреева</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#EEF0EA; --surface:#FFFFFF; --field:#F6F7F3; --ink:#172031; --muted:#5E6675; --line:#D8DBD1;
  --accent:#3346D3; --accent-ink:#FFFFFF; --accent-soft:#E4E8FF;
  --red:#C8413B; --red-soft:#FBE7E5; --amber:#B97812; --amber-soft:#FCEFD8; --green:#23845A; --green-soft:#DDF2E6;
  --b1:#3346D3; --b2:#C8413B; --b3:#23845A; --b4:#B97812;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151D; --surface:#181E29; --field:#1F2633; --ink:#E7EAF0; --muted:#9AA2B2; --line:#2B3342;
    --accent:#8391FF; --accent-ink:#0F1320; --accent-soft:#252C55;
    --red:#F07A72; --red-soft:#3A1E1E; --amber:#E7B14E; --amber-soft:#3A2D14; --green:#5CCB95; --green-soft:#17342A;
    --b1:#8391FF; --b2:#F07A72; --b3:#5CCB95; --b4:#E7B14E;
  }
}
:root[data-theme="dark"]{
  --paper:#11151D; --surface:#181E29; --field:#1F2633; --ink:#E7EAF0; --muted:#9AA2B2; --line:#2B3342;
  --accent:#8391FF; --accent-ink:#0F1320; --accent-soft:#252C55;
  --red:#F07A72; --red-soft:#3A1E1E; --amber:#E7B14E; --amber-soft:#3A2D14; --green:#5CCB95; --green-soft:#17342A;
  --b1:#8391FF; --b2:#F07A72; --b3:#5CCB95; --b4:#E7B14E;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Onest",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Unbounded","Onest",system-ui,sans-serif;font-weight:700;line-height:1.2;margin:0}
h1{font-size:clamp(22px,3.2vw,30px);letter-spacing:-.01em}
h2{font-size:18px;margin-bottom:6px}
h3{font-size:15px;font-weight:500}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.top-in{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1400px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:"Unbounded",sans-serif;font-size:15px;font-weight:700;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted)}
.proj{flex:1;min-width:0;max-width:340px}
.proj input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.saved{font-size:12px;color:var(--muted);white-space:nowrap;transition:color .3s}
.saved.on{color:var(--green)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1400px;margin:0 auto}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);align-self:start;padding:22px 12px 22px 20px;max-height:calc(100vh - 62px);overflow:auto}
.phase{font-size:12px;color:var(--muted);margin:16px 10px 6px}
.phase:first-child{margin-top:0}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-size:14px}
.nav-i:hover{background:var(--surface)}
.nav-i.on{background:var(--ink);color:var(--paper)}
.nav-i .n{font-family:"Unbounded",sans-serif;font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;flex:none}
.nav-i .t{flex:1;min-width:0}
.nav-i .p{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
main{padding:24px 24px 80px;min-width:0}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.view-head p{max-width:62ch;margin-top:8px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-head p{max-width:64ch}
.stripe{border-left:4px solid var(--c,var(--accent))}

/* fields */
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;background:var(--field);border:1px solid transparent;border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink);min-width:0}
input:hover,textarea:hover,select:hover{border-color:var(--line)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea{resize:none;min-height:40px;overflow:hidden;line-height:1.45}
input[type=number]{font-variant-numeric:tabular-nums}
::placeholder{color:var(--muted);opacity:.7}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 16px}

/* tables */
.wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{border-collapse:separate;border-spacing:0;width:100%}
.t th{font-weight:600;font-size:13px;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:bottom;white-space:nowrap}
.t td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.t td.lbl{font-size:14px;padding:12px 10px 8px 4px;min-width:200px;max-width:280px}
.t tr.grp td{font-family:"Unbounded",sans-serif;font-size:13px;font-weight:500;padding:18px 4px 8px;border-bottom:1px solid var(--ink)}
.t td.calc{font-variant-numeric:tabular-nums;font-weight:600;padding:12px 8px;white-space:nowrap}
.t .num{width:84px}
.t .w120{min-width:120px}.t .w160{min-width:160px}.t .w200{min-width:200px}.t .w240{min-width:240px}
.t tr.best td{background:var(--accent-soft)}
.t tr.worst td{background:var(--red-soft)}
.t td.x{width:36px}
.iconbtn{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:6px;line-height:1}
.iconbtn:hover{color:var(--red);background:var(--red-soft)}

/* chips & tags */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{border-style:dashed}
.hint{display:inline-flex;gap:6px;align-items:baseline;border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:5px 9px;font-size:13px;text-align:left;margin:2px 6px 6px 0;max-width:100%}
.hint i{font-style:normal;opacity:.7;white-space:nowrap}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;white-space:nowrap;font-weight:500}
.tag.c{background:var(--red-soft);color:var(--red)}
.tag.i{background:var(--amber-soft);color:var(--amber)}
.tag.n{background:var(--green-soft);color:var(--green)}
.tag.auto{background:var(--accent-soft);color:var(--accent)}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.cols{display:flex;align-items:flex-end;gap:10px;height:210px;padding:12px 0 0}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;border:0;background:transparent;padding:0}
.col .shaft{flex:1;width:100%;border-radius:8px 8px 3px 3px;background:var(--field);position:relative;overflow:hidden;border:1px solid var(--line)}
.col .fill{position:absolute;left:0;right:0;bottom:0;background:var(--ink);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.col .pct{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;font-weight:600;mix-blend-mode:difference;color:#fff}
.col .cap{font-size:11px;overflow-wrap:anywhere;text-align:center;line-height:1.2;min-height:30px;color:var(--muted)}
.col:hover .shaft{border-color:var(--ink)}
.plinth{height:10px;background:var(--ink);border-radius:3px;margin-top:6px}
.plinth-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.kv{display:grid;gap:14px}
.kv div>span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.kv div>p{font-size:15px}
.kv .big{font-family:"Unbounded",sans-serif;font-size:17px;line-height:1.35;font-weight:500}
.empty{color:var(--muted);font-style:italic}
.verdict{border-radius:12px;padding:14px 16px;font-weight:500}
.verdict.go{background:var(--green-soft);color:var(--green)}
.verdict.stop{background:var(--red-soft);color:var(--red)}
.verdict ul{margin:8px 0 0;padding-left:18px;font-weight:400}
.next{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* interview */
.q{display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .qn{font-family:"Unbounded",sans-serif;font-size:13px;color:var(--c);padding-top:2px}
.q .qt{font-weight:500}
.q .qh{font-size:13px;color:var(--muted);margin:2px 0 8px}
.q .qa{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px}
.blockhead{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.blockhead .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-1px)}

/* launch */
.li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;margin-top:1px}
.cb.on{background:var(--green);border-color:var(--green);color:#fff}
.cb svg{width:14px;height:14px}
.li.done .lt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.li .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 6px;font-size:13px;color:var(--muted)}
.li .late{color:var(--red);font-weight:600}
.progress{height:8px;background:var(--field);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--green);transition:width .4s}

/* plot & funnel */
.plotwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
svg.plot{width:100%;max-width:440px;height:auto;display:block}
.fn{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(0,2fr) 70px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.fn .bar{height:22px;background:var(--field);border-radius:5px;overflow:hidden}
.fn .bar i{display:block;height:100%;background:var(--accent);border-radius:5px;min-width:2px}
.fn.drop .bar i{background:var(--red)}
.fn .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.callout{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:10px}
.callout.ok{background:var(--accent-soft);color:var(--accent)}

.foot{font-size:12px;color:var(--muted);margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line);max-height:none;scrollbar-width:none}
  nav.rail::-webkit-scrollbar{display:none}
  .phase{display:none}
  .nav-i{width:auto;white-space:nowrap;padding:7px 10px;flex:none}
  .nav-i .p{display:none}
  main{padding:18px 14px 70px}
  .hero,.plotwrap{grid-template-columns:1fr}
  .proj{display:none}
  .top-in{padding:10px 14px}
  .brand span{display:none}
  .q .qa{grid-template-columns:1fr}
  .panel{padding:16px;border-radius:12px}
  .cols{height:170px;gap:6px}
}
@media (max-width:520px){
  .top-actions .btn.hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>Система запуска</b><span>Александра Дреева</span></div>
  <div class="proj"><input type="text" data-p="project" placeholder="Название твоего продукта" aria-label="Название продукта"></div>
  <div class="top-actions">
    <span class="saved" id="saved">Сохранено</span>
    <button class="btn hide-s" id="btnXlsx">Скачать Excel</button>
    <button class="btn ghost" id="btnMenu" aria-label="Резервная копия">•••</button>
  </div>
</div></header>
<div class="shell">
  <nav class="rail" id="nav"></nav>
  <main id="main"></main>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script>
/* ============ DATA DEFINITIONS ============ */
const IV_BLOCKS=[
 {t:'Контекст',time:'2–3 минуты',c:'var(--b1)',q:[
  ['Расскажи коротко о своём бизнесе — чем занимаешься, как давно?','Понять стадию и нишу'],
  ['Как выглядит твой типичный рабочий день прямо сейчас?','Понять операционную загрузку'],
  ['Какие задачи занимают больше всего твоего времени?','Найти, где «застревает» время']]},
 {t:'Боль',time:'5–7 минут',c:'var(--b2)',q:[
  ['Что сейчас главная проблема в твоём бизнесе? Расскажи подробнее.','Главная боль → в крючок Reels'],
  ['Как давно эта проблема существует?','Глубина боли → в контент'],
  ['Это мешает тебе лично или это проблема бизнеса в целом?','Личная vs деловая боль'],
  ['Что ты уже пробовал, чтобы решить это?','Предыдущий опыт → в возражения'],
  ['Почему это не сработало или сработало не так, как хотелось?','Провал предыдущих решений → в оффер'],
  ['Что происходит, если эта проблема останется нерешённой через год?','Цена бездействия → в продающие посты']]},
 {t:'Желаемый результат',time:'3–5 минут',c:'var(--b3)',q:[
  ['Как выглядит идеальная ситуация в твоём бизнесе через 3 месяца?','Желаемый результат → в оффер'],
  ['Что конкретно изменится, если проблема решится?','Ценность результата → в заголовок'],
  ['Как ты поймёшь, что результат достигнут — что конкретно увидишь или почувствуешь?','Критерий успеха → в кейсы']]},
 {t:'Покупательское поведение',time:'3–5 минут',c:'var(--b4)',q:[
  ['Когда ты последний раз покупал обучающий продукт или инструмент для бизнеса? Что это было?','Паттерн покупок'],
  ['Почему купил именно это — что привлекло?','Триггер покупки → в оффер'],
  ['Что тебя останавливает, когда думаешь о покупке нового продукта?','Главное возражение → в продажи']]}
];
const IV_SUM=[['pain','Главная боль одной фразой (словами клиента)'],['tried','Что уже пробовал и почему не помогло'],['result','Желаемый результат (его слова)'],['objection','Главное возражение перед покупкой'],['quote','Самая сильная цитата, которую можно использовать']];
const IV_PAT=[['pain','Боль, которая встречается чаще всего'],['words','Слова, которые повторяются (цитаты)'],['tried','Что все пробовали и почему не помогло'],['result','Результат, который хотят все'],['objection','Возражение, которое встречается у всех']];

const SEG_KEYS=['A','B','C'], SEG_L={A:'А',B:'Б',C:'В'};
const SEG_GROUPS=[
 ['Кто это',[['name','Название сегмента (как ты его называешь)'],['who','Кто это — краткое описание'],['age','Возраст / пол'],['sphere','Сфера бизнеса'],['stage','Стадия бизнеса (старт / рост / масштаб)'],['income','Средний доход / оборот']]],
 ['Что болит',[['pain','Главная боль прямо сейчас'],['night','Что не даёт спать ночью'],['tried','Что уже пробовал'],['whyfail','Почему предыдущие решения не сработали']]],
 ['Что хочет',[['want','Желаемый результат через 3 месяца'],['words','Как формулирует результат своими словами'],['ideal','Идеальная картина будущего']]],
 ['Где живёт',[['online','Где проводит время онлайн'],['reads','Что читает / смотрит'],['follows','На кого подписан']]],
 ['Покупательское поведение',[['pay','Готовность платить за продукт (₽)'],['objection','Главное возражение перед покупкой'],['decide','Что помогает принять решение']]],
 ['Приоритет',[['prio','Приоритет (1 = главный)'],['why','Почему этот сегмент важнее']]]
];
const PORTRAIT=[['name','Имя (придумай для удобства)'],['who','Кто он / она — кратко'],['now','Что происходит в бизнесе прямо сейчас'],['annoys','Что его бесит больше всего'],['night','О чём думает в 2 ночи'],['tried','Что уже пробовал — почему не помогло'],['want','Что хочет получить через 3 месяца'],['ideal','Как выглядит его идеальный результат'],['tell','Что он скажет другу, если продукт сработает'],['objection','Его главное возражение перед покупкой'],['word','Одно слово, которым он описывает свою боль'],['fan','Что сделает его фанатом твоего бренда']];
const CMAP=[['res','Какой контент резонирует'],['reels','Темы для Reels'],['offer','Слова в оффере'],['lead','Лид-магнит']];

const CJM_DEF=[
 ['Осознание боли','Понимает, что есть проблема','Что-то не так в бизнесе','Тревога, усталость','Контент про боль в Reels'],

function calcWeek(key,w){
 if(key==='revCum'){let s=0,any=false;for(let i=0;i<=w;i++){const v=num(S.met.w.rev?.[i]);if(v!=null){s+=v;any=true}}return any?s:null}

 return null}
function monthFact(key,kind){
 if(kind==='calc'){
  if(key==='revCum'){return calcWeek('revCum',3)??calcWeek('revCum',2)??calcWeek('revCum',1)??calcWeek('revCum',0)}
  if(key==='conv'){const p=sumW('paid'),c=sumW('code');return p!=null&&c?p/c*100:null}
  if(key==='check'){const r=sumW('rev'),p=sumW('paid');return r!=null&&p?r/p:null}}
 const v=weekVals(key).filter(x=>x!=null);if(!v.length)return null;
 if(kind==='sum')return v.reduce((a,b)=>a+b,0);
 if(kind==='avg')return v.reduce((a,b)=>a+b,0)/v.length;
 if(kind==='max')return Math.max(...v);
 return weekVals(key).reduce((a,b)=>b!=null?b:a,null)}

  }else r.conv=r.n!=null?100:null});
 const withGoal=rows.filter(r=>r.i>0&&r.conv!=null&&r.goal);
 if(withGoal.length){worst=withGoal.reduce((a,b)=>b.conv/b.goal<a.conv/a.goal?b:a);if(worst.conv>=worst.goal)worst=null}
 else{rows.forEach(r=>{if(r.i>=2&&r.i<7&&r.conv!=null&&(worst==null||r.conv<worst.conv))worst=r})}
 return{rows,worst}}

/* progress per tool, 0..1 */
function prog(id){
 const ratio=(a,b)=>b?Math.min(1,a/b):0;
 switch(id){
 case 'interview':{const n=ivCount();const pat=IV_PAT.filter(([k])=>filled(S.ivPat[k])).length;return ratio(n,5)*.8+ratio(pat,5)*.2}
 case 'segments':{const core=SEG_GROUPS.flatMap(g=>g[1]).map(x=>x[0]);let f=0;['A','B'].forEach(k=>core.forEach(c=>{if(filled(S.seg[k][c]))f++}));
   const p=PORTRAIT.filter(([k])=>filled(S.portrait[k])).length;return ratio(f,core.length*2)*.6+ratio(p,PORTRAIT.length)*.4}
 case 'cjm':{const l=LOSSES.filter((_,i)=>filled(S.cjm.loss[i]?.cause)).length;return ratio(cjmConvCount(),11)*.6+ratio(l,10)*.4}
 case 'matrix':{let f=0;for(let i=0;i<10;i++)for(let c=0;c<6;c++)if(num(S.mx.s[i]?.[c])!=null)f++;const cc=MX_CONCL.filter(([k])=>filled(S.mx.concl[k])).length;return ratio(f,60)*.7+ratio(cc,6)*.3}
 case 'gap':{let f=GAP_Q.filter((_,i)=>filled(S.gap.q[i])).length+FORMULA.filter(([k])=>filled(S.gap.f[k])).length+(filled(S.gap.offer)?3:0)+GAP_CHECKS.filter((_,i)=>filled(S.gap.ck[i]?.v)).length;
   let m=0;GAP_CHARS.forEach((_,i)=>{if(filled(S.gap.m[i]?.you))m++});return ratio(f+m*.5,6+5+3+6+5)}
 case 'launch':{const all=allLaunchItems();return ratio(all.filter(x=>isDone(x[0])).length,all.length)}
 case 'metrics':{let w=0;for(let i=0;i<4;i++)if(num(S.met.w.rev?.[i])!=null||num(S.met.w.igSubs?.[i])!=null)w++;return ratio(w,4)}
 }return 0}

 h+=`<section class="panel"><div class="panel-head"><h2>Сегменты</h2><p class="small">${calc('prioSeg')}</p></div><div class="wrap"><table class="t"><thead><tr><th>Параметр</th>${SEG_KEYS.map(k=>`<th class="w200">Сегмент ${SEG_L[k]}</th>`).join('')}</tr></thead><tbody>`;
 SEG_GROUPS.forEach(([g,rows])=>{h+=`<tr class="grp"><td colspan="4">${g}</td></tr>`;rows.forEach(([key,l])=>{h+=`<tr><td class="lbl">${l}</td>${SEG_KEYS.map(k=>`<td class="w200">${key==='prio'?sel(`seg.${k}.prio`,[['1','1 — главный'],['2','2'],['3','3']]):key==='pay'?nin(`seg.${k}.pay`,'₽','w120'):ta(`seg.${k}.${key}`)}</td>`).join('')}</tr>`})});
 h+=`</tbody></table></div></section>`;
 const pk=prioritySeg();const ps=pk?S.seg[pk]:{};
 const hints={who:ps.who,now:ps.pain,night:ps.night,tried:[ps.tried,ps.whyfail].filter(filled).join(' — '),want:ps.want,ideal:ps.ideal,objection:ps.objection};
 h+=`<section class="panel"><div class="panel-head"><div><h2>Портрет приоритетного клиента</h2><p class="muted small">Дай ему имя — так проще писать контент. Пиши, как будто рассказываешь другу.${pk?' Подсказки взяты из приоритетного сегмента — нажми, чтобы вставить.':''}</p></div></div>
  ${PORTRAIT.map(([k,l])=>field(l,(filled(hints[k])&&!filled(S.portrait[k])?`<button class="hint" data-fill="portrait.${k}" data-v="${esc(hints[k])}"><i>из сегмента</i>${esc(hints[k])}</button>`:'')+ta(`portrait.${k}`))).join('')}</section>`;
 h+=`<section class="panel"><div class="panel-head"><h2>Контентная карта по сегментам</h2></div><div class="wrap"><table class="t"><thead><tr><th>Сегмент</th>${CMAP.map(c=>`<th class="w200">${c[1]}</th>`).join('')}</tr></thead><tbody>${SEG_KEYS.map(k=>`<tr><td class="lbl"><b>${esc(segName(k))}</b></td>${CMAP.map(([c])=>`<td class="w200">${ta(`cmap.${k}.${c}`)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
 return h};

R.cjm=()=>{
 let h=head('3. Путь клиента (CJM)','Пройди каждый этап и найди, где именно теряются клиенты. Тексты этапов можно редактировать под свой продукт.');
 h+=`<section class="panel"><div class="panel-head"><h2>Карта пути</h2></div><div class="wrap"><table class="t"><thead><tr><th>#</th>${CJM_COLS.map(c=>`<th>${c[1]}</th>`).join('')}<th>Конверсия, %</th><th>Проблема на этапе</th></tr></thead><tbody>`;
 CJM_DEF.forEach((d,i)=>{if(S.cjm.st[i]==null)S.cjm.st[i]={};CJM_COLS.forEach(([k],j)=>{if(S.cjm.st[i][k]==null)S.cjm.st[i][k]=d[j]});
  h+=`<tr data-cjm="${i}"><td class="calc">${i+1}</td>${CJM_COLS.map(([k,,w])=>`<td class="${w}">${ta(`cjm.st.${i}.${k}`)}</td>`).join('')}<td>${nin(`cjm.st.${i}.conv`,'%')}</td><td class="w200">${ta(`cjm.st.${i}.problem`)}</td></tr>`});
 h+=`</tbody></table></div>${calc('cjmRows')}${calcDiv('cjmWorst')}</section>`;
 h+=`<section class="panel"><div class="panel-head"><div><h2>Точки потери</h2><p class="muted small">Где теряются деньги. Приоритет 5 — чинить первым.</p></div></div><div class="wrap"><table class="t"><thead><tr><th>Симптом</th><th>Вероятная причина</th><th>Что исправить</th><th>Приоритет</th></tr></thead><tbody>${LOSSES.map((t,i)=>`<tr><td class="lbl">${esc(t)}</td><td class="w200">${ta(`cjm.loss.${i}.cause`)}</td><td class="w200">${ta(`cjm.loss.${i}.fix`)}</td><td>${sel(`cjm.loss.${i}.p`,[['5','5'],['4','4'],['3','3'],['2','2'],['1','1']])}</td></tr>`).join('')}</tbody></table></div>${calcDiv('lossTop')}</section>`;
 h+=`<section class="panel"><div class="panel-head"><div><h2>Слова клиента</h2><p class="muted small">Дословно. Сильные цитаты из интервью подтягиваются сюда сами.</p></div><button class="btn sm" data-act="addWord">+ Строка</button></div><div class="wrap"><table class="t"><thead><tr><th>Этап</th><th>Цитата (дословно)</th><th>Где сказал</th><th>Как использовать в упаковке</th></tr></thead><tbody>
  ${WORD_STAGES.map((s,i)=>`<tr><td class="lbl">${s}</td><td class="w240">${ta(`cjm.words.${i}.q`)}</td><td class="w120">${ta(`cjm.words.${i}.where`)}</td><td class="w200">${ta(`cjm.words.${i}.use`)}</td></tr>`).join('')}
  ${S.cjm.extra.map((r,i)=>`<tr><td class="w160">${inp(`cjm.extra.${i}.stage`,'Этап')}</td><td class="w240">${ta(`cjm.extra.${i}.q`)}</td><td class="w120">${ta(`cjm.extra.${i}.where`)}</td><td class="w200">${ta(`cjm.extra.${i}.use`)}</td><td class="x"><button class="iconbtn" data-act="delWord" data-i="${i}" aria-label="Удалить">✕</button></td></tr>`).join('')}
  ${C.ivQuotes()}</tbody></table></div></section>`;

R.matrix=()=>{

  ${MX_PARAMS.map((p,i)=>`<tr><td class="lbl">${p[0]}</td>${P.map(pp=>`<td>${nin(`mx.s.${i}.${pp.c}`,'1–10')}</td>`).join('')}</tr>`).join('')}

 const opts=MX_PARAMS.map((p,i)=>[String(i),p[0]]);

 h+=`<section class="panel"><div class="panel-head"><h2>Выводы и стратегия</h2></div>${MX_CONCL.map(([k,l])=>field(l,ta(`mx.concl.${k}`))).join('')}</section>`;

C.mxName=c=>esc(filled(S.mx.names[+c])?S.mx.names[+c]:`Конкурент ${+c+1}`);

R.gap=()=>{
 let h=head('5. GAP-анализ и оффер','Найди место на рынке, где тебя ждут, и собери позиционирование в одну фразу. Заполняй после матрицы конкурентов.');
 h+=`<section class="panel"><div class="panel-head"><h2>Шаг 1. Матрица характеристик рынка</h2></div><div class="wrap"><table class="t"><thead><tr><th>Характеристика</th><th>Все конкуренты дают</th><th>Никто не даёт</th><th>Ты можешь дать</th></tr></thead><tbody>${GAP_CHARS.map((c,i)=>`<tr><td class="lbl">${c}</td>${['all','none','you'].map(k=>`<td class="w200">${ta(`gap.m.${i}.${k}`)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
 const pat=S.ivPat;
 const hq={0:pat.tried,3:pat.result};
 h+=`<section class="panel"><div class="panel-head"><h2>Шаг 2. Дыра рынка</h2></div>${GAP_Q.map((q,i)=>field(i===5?`<b style="color:var(--ink)">${q}</b>`:q,(filled(hq[i])&&!filled(S.gap.q[i])?`<button class="hint" data-fill="gap.q.${i}" data-v="${esc(hq[i])}"><i>из интервью</i>${esc(hq[i])}</button>`:'')+ta(`gap.q.${i}`))).join('')}</section>`;
 const pk=prioritySeg();const P=S.portrait;
 const hf={who:[P.who,pk?S.seg[pk].who:''],result:[pat.result,P.want],how:[S.mx.concl.adv],obj:[pat.objection,P.objection],time:[]};
 h+=`<section class="panel"><div class="panel-head"><div><h2>Шаг 3. Формула позиционирования</h2><p class="muted small">Подсказки собраны из интервью, портрета и выводов по конкурентам — нажми, чтобы вставить.</p></div></div>
  ${FORMULA.map(([k,l,d])=>{const hs=[...new Set(hf[k].filter(filled))];return field(`${l} <span class="muted">— ${d}</span>`,(!filled(S.gap.f[k])?hs.map(v=>`<button class="hint" data-fill="gap.f.${k}" data-v="${esc(v)}"><i>подсказка</i>${esc(v)}</button>`).join(''):'')+ta(`gap.f.${k}`))}).join('')}
  <div style="background:var(--accent-soft);border-radius:12px;padding:16px;margin-top:6px"><p class="small muted" style="margin-bottom:6px">Собранная формула</p><p style="font-family:Unbounded,sans-serif;font-size:16px;line-height:1.45;font-weight:500">${calc('formula')}</p><button class="btn sm" data-act="useFormula" style="margin-top:12px">Сделать итоговым оффером</button></div>
  <div style="margin-top:16px">${field('<b style="color:var(--ink)">Итоговый оффер одной фразой</b>',ta('gap.offer','Отшлифуй формулу до живой фразы'))}</div></section>`;
 h+=`<section class="panel"><div class="panel-head"><h2>Шаг 4. Проверка позиционирования</h2></div><div class="wrap"><table class="t"><thead><tr><th>Вопрос</th><th>Да / нет</th><th></th><th>Если не так — что исправить</th></tr></thead><tbody>${GAP_CHECKS.map((q,i)=>`<tr><td class="lbl">${q}</td><td style="min-width:90px">${sel(`gap.ck.${i}.v`,[['yes','Да'],['no','Нет']])}</td><td class="calc">${calc('ckFlag',i)}</td><td class="w200">${ta(`gap.ck.${i}.fix`)}</td></tr>`).join('')}</tbody></table></div></section>`;
 return h};

function liHtml(id,text,imp,dl,store){
 const done=store==='launch'?isDone(id):!!S.after.it[id];const auto=store==='launch'&&autoDone(id)!=null&&S.launch.it[id]==null;
 const off=dayOffset(dl);const d=dateFor(off);const late=d&&!done&&d<today0();
 return `<div class="li${done?' done':''}"><button class="cb${done?' on':''}" data-toggle="${store}|${id}" aria-pressed="${done}" aria-label="${esc(text)}">${done?CHECK:''}</button><div><p class="lt">${esc(text)}</p>
  <div class="meta">${imp?`<span class="tag ${IMP[imp][0]}">${IMP[imp][1]}</span>`:''}<span class="${late?'late':''}">${esc(dl)}${d?` · ${fmtD(d)}`:''}${late?' · просрочено':''}</span>${auto?`<span class="tag auto">${done?'выполнено по данным':'проверяется по данным'}</span>`:''}</div>
  ${ta(`${store==='launch'?'launch':'after'}.c.${id}`,'Комментарий / кто делает')}</div></div>`}

 h+=`<section class="panel"><div class="grid2" style="align-items:end">${field('Дата открытия продаж',`<input type="date" data-p="launch.date" value="${esc(S.launch.date)}" data-rerender="1">`)}<p class="small muted" style="margin-bottom:14px">Когда дата задана, у каждого пункта появится календарный дедлайн, а просроченные подсветятся.</p></div>${calcDiv('launchSum')}</section>`;

R.metrics=()=>{
 let h=head('7. Метрики: план и факт','Заполняй каждый понедельник — 15 минут. Цель — видеть тренд, а не просто цифры. Серые строки считаются сами.');
 h+=`<section class="panel"><div class="panel-head"><h2>Еженедельный дашборд</h2></div><div class="wrap"><table class="t"><thead><tr><th>Метрика</th><th>Неделя 1</th><th>Неделя 2</th><th>Неделя 3</th><th>Неделя 4</th><th>Факт за месяц</th><th>Цель</th><th>Выполнено</th></tr></thead><tbody>`;
 METRICS.forEach(([g,rows])=>{h+=`<tr class="grp"><td colspan="8">${g}</td></tr>`;rows.forEach(([k,l,kind])=>{
  h+=`<tr><td class="lbl">${l}${kind!=='calc'&&kind!=='sum'?`<br><span class="small muted">${kind==='last'?'факт = последняя неделя':kind==='avg'?'факт = среднее':'факт = максимум'}</span>`:''}</td>${[0,1,2,3].map(w=>kind==='calc'?`<td class="calc muted">${calc('wk',k+'|'+w)}</td>`:`<td>${nin(`met.w.${k}.${w}`)}</td>`).join('')}
  <td class="calc">${calc('mFact',k+'|'+kind)}</td><td>${nin(`met.goal.${k}`,'цель')}</td><td class="calc">${calc('mPct',k+'|'+kind)}</td></tr>`})});
 h+=`</tbody></table></div></section>`;
 h+=`<section class="panel"><div class="panel-head"><div><h2>Анализ контента</h2><p class="muted small">Что работает, что нет. Вовлечённость = (лайки + сохранения + комментарии) / охват.</p></div><button class="btn sm" data-act="addContent">+ Публикация</button></div>`;
 if(!S.met.content.length)h+=`<p class="empty">Добавь первую публикацию — вовлечённость посчитается автоматически.</p>`;
 else h+=`<div class="wrap"><table class="t"><thead><tr><th>Дата</th><th>Тип</th><th>Тема / заголовок</th><th>Охват</th><th>Лайки</th><th>Сохр.</th><th>Комм.</th><th>Подписки</th><th>Вовл.</th><th>Вывод / инсайт</th><th></th></tr></thead><tbody>${S.met.content.map((r,i)=>`<tr><td><input type="date" data-p="met.content.${i}.date" value="${esc(r.date)}"></td><td style="min-width:110px">${sel(`met.content.${i}.type`,CONTENT_TYPES.map(t=>[t,t]))}</td><td class="w200">${ta(`met.content.${i}.topic`)}</td>${['reach','likes','saves','comm','subs'].map(k=>`<td>${nin(`met.content.${i}.${k}`)}</td>`).join('')}<td class="calc">${calc('er',i)}</td><td class="w200">${ta(`met.content.${i}.insight`)}</td><td class="x"><button class="iconbtn" data-act="delContent" data-i="${i}" aria-label="Удалить">✕</button></td></tr>`).join('')}</tbody></table></div>`;
 h+=`${calcDiv('contentSum')}</section>`;
 h+=`<section class="panel"><div class="panel-head"><div><h2>Воронка продаж</h2><p class="muted small">Впиши количество людей на каждом этапе и целевую конверсию. Красным — самое слабое звено: с целями — дальше всего от цели, без целей — самая низкая конверсия после лид-магнита.</p></div></div>
  <div class="wrap"><table class="t"><thead><tr><th>Этап</th><th>Людей</th><th>Конв. от пред.</th><th>От охвата</th><th>Цель, %</th><th>Что улучшить</th></tr></thead><tbody>${FUNNEL.map((t,i)=>`<tr><td class="lbl">${t}</td><td>${nin(`met.fn.${i}.n`,'','w120')}</td><td class="calc">${calc('fnConv',i)}</td><td class="calc muted">${calc('fnTop',i)}</td><td>${i?nin(`met.fn.${i}.goal`,'%'):'<span class="muted small">100%</span>'}</td><td class="w200">${ta(`met.fn.${i}.fix`)}</td></tr>`).join('')}</tbody></table></div>
  <div style="margin-top:18px">${calcDiv('funnel')}</div></section>`;
 return h};

/* ============ RENDER ============ */
function renderNav(){let h='',ph=undefined;VIEWS.forEach(v=>{if(v.ph!==ph&&v.ph){h+=`<div class="phase">${v.ph}</div>`}ph=v.ph;
 h+=`<button class="nav-i${UI.view===v.id?' on':''}" data-go="${v.id}">${v.n?`<span class="n">${v.n}</span>`:'<span class="n">◎</span>'}<span class="t">${v.t}</span>${v.n?`<span class="p">${calc('navp',v.id)}</span>`:''}</button>`});
 document.getElementById('nav').innerHTML=h}
function refresh(){document.querySelectorAll('[data-c]').forEach(el=>{const f=C[el.dataset.c];if(f){const out=f(el.dataset.a);if(el.innerHTML!==out)el.innerHTML=out}})}
function autosize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
function render(keepScroll){const y=window.scrollY;document.getElementById('main').innerHTML=R[UI.view]()+footer();renderNav();refresh();
 document.querySelectorAll('textarea').forEach(autosize);document.querySelector('.top input').value=S.project||'';
 if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
 const on=document.querySelector('.nav-i.on');if(on&&window.innerWidth<=900)on.scrollIntoView({inline:'center',block:'nearest'})}
function footer(){return `<div class="foot"><span>Данные хранятся в этом браузере. Раз в неделю сохраняй резервную копию.</span></div>`}

/* ============ EVENTS ============ */
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.p)return;set(el.dataset.p,el.value);if(el.tagName==='TEXTAREA')autosize(el);refresh();
 if(el.dataset.p==='project'){if(UI.view==='home'){const h=document.querySelector('.view-head h1');if(h)h.textContent=S.project||'Система запуска продукта'}}});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.dataset.p)return;set(el.dataset.p,el.value);
 const p=el.dataset.p;if(el.dataset.rerender||p.startsWith('seg.')&&p.endsWith('.prio')||p==='mx.ax'||p==='mx.ay')render(true);else refresh()});
document.addEventListener('click',e=>{
 const go=e.target.closest('[data-go]');if(go){UI.view=go.dataset.go;try{localStorage.setItem(KEY+':view',UI.view)}catch(_){ }render();return}
 const ivb=e.target.closest('[data-iv]');if(ivb){UI.iv=+ivb.dataset.iv;render(true);return}
 const fill=e.target.closest('[data-fill]');if(fill){set(fill.dataset.fill,fill.dataset.v);render(true);return}
 const tg=e.target.closest('[data-toggle]');if(tg){const [store,id]=tg.dataset.toggle.split('|');
  if(store==='launch'){S.launch.it[id]=!isDone(id)}else{S.after.it[id]=!S.after.it[id]}save();render(true);return}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,i=+a.dataset.i;
 if(act==='addIv'){S.interviews.push({name:'',niche:'',date:new Date().toISOString().slice(0,10),a:{},k:{},s:{}});UI.iv=S.interviews.length-1;save();render(true)}
 if(act==='delIv'){if(confirm('Удалить это интервью? Действие нельзя отменить.')){S.interviews.splice(i,1);UI.iv=Math.max(0,i-1);save();render(true)}}
 if(act==='addWord'){S.cjm.extra.push({});save();render(true)}
 if(act==='delWord'){S.cjm.extra.splice(i,1);save();render(true)}
 if(act==='addContent'){S.met.content.push({date:new Date().toISOString().slice(0,10),type:'Reels'});save();render(true)}
 if(act==='delContent'){S.met.content.splice(i,1);save();render(true)}
 if(act==='useFormula'){S.gap.offer=formulaText();save();render(true);toast('Формула перенесена в итоговый оффер')}
 if(act==='exportJson')exportJson();
 if(act==='importJson')document.getElementById('fileIn').click();
 if(act==='reset'){if(confirm('Стереть все данные во всех инструментах? Сначала сохрани резервную копию.')){S=blank();save();UI.view='home';render()}}
});

/* menu */
document.getElementById('btnMenu').addEventListener('click',()=>{
 const m=document.getElementById('menuPop');if(m){m.remove();return}
 const d=document.createElement('div');d.id='menuPop';d.className='panel';
